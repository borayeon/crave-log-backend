name: CraveLog Backend Production CI/CD

on:
  push:
    branches: [ "main" ] # 🔥 main 브랜치에 푸시될 때만 작동
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. Grant execute permission and Build
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: 4. Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 5. Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 🔥 태그를 latest 대신 prod로 지정 (이전에 만든 docker-compose.yml과 맞춤)
          tags: ${{ secrets.DOCKER_USERNAME }}/cravelog-backend:prod