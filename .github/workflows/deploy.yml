name: CraveLog Backend CI/CD

on:
  push:
    branches: [ "main" ] # main 브랜치에 코드가 푸시될 때 작동 (환경에 맞게 수정)

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 불러오기
        uses: actions/checkout@v3

      - name: 2. Java 21 환경 세팅
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto' # 또는 temurin

      - name: 3. Gradle 권한 부여 및 빌드
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test # 테스트 코드가 없다면 -x test 유지, 있다면 제거

      - name: 4. Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 5. Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cravelog-backend:latest